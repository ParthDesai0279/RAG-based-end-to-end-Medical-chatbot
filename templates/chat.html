<!-- templates/chat.html -->
<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Medical Chatbot</title></head>
  <body>
    <h1>Medical Chat</h1>
    <form id="chat-form">
      <input name="msg" id="msg" autocomplete="off"/>
      <button>Send</button>
    </form>
    <pre id="response"></pre>

    <script>
      const form = document.getElementById('chat-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg').value;
        const fd = new FormData();
        fd.append('msg', msg);
        const res = await fetch('/get', {method:'POST', body: fd});
        const text = await res.text();
        document.getElementById('response').innerText = text;
      });
    </script>
  </body>
</html>
